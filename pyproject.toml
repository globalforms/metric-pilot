[project]
name = "globalforms-metric-pilot"
version = "0.1.0"
description = "Executable form specification for the GlobalForms metric pilot"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.10,<3", "platformdirs>=4,<5", "python-dotenv>=1,<2"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "nbconvert>=7,<8", "matplotlib>=3.8,<4"]
pdf = ["reportlab>=4,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/globalforms"]
